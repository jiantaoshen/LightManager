name: Redirect old LightManager site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment token
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is missing or unavailable."
            exit 1
          fi

          echo "Deployment token is available."

      - name: Create redirect site
        shell: bash
        run: |
          mkdir -p redirect-site

          cat > redirect-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />

            <meta
              http-equiv="refresh"
              content="0; url=https://lightmanager.jiantao.dev"
            />

            <meta name="robots" content="noindex" />

            <title>LightManager has moved</title>

            <script>
              window.location.replace("https://lightmanager.jiantao.dev");
            </script>
          </head>

          <body>
            <p>
              LightManager has moved to
              <a href="https://lightmanager.jiantao.dev">
                lightmanager.jiantao.dev
              </a>.
            </p>
          </body>
          </html>
          EOF

          cat > redirect-site/staticwebapp.config.json <<'EOF'
          {
            "navigationFallback": {
              "rewrite": "/index.html"
            }
          }
          EOF

      - name: Deploy redirect to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "redirect-site"
          output_location: ""
          skip_app_build: true
